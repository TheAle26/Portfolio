{% extends 'AppFulbo/base.html' %}
{% load i18n %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-lg p-4 mb-5 bg-body rounded" style="width: 100%; max-width: 450px;">
        <div class="card-body text-center">
            
            <h2 class="card-title mb-3 text-success fw-bold">{% translate "¡Todo listo!" %} ✅</h2>
            
            <p class="card-text text-muted mb-4">
                {% translate "Tu contraseña se restableció correctamente. Ya podés ingresar con tus nuevas credenciales." %}
            </p>

            <div class="d-grid gap-2">
                <a href="{% url 'login' %}" class="btn btn-primary btn-lg">
                    {% translate "Iniciar sesión ahora" %}
                </a>
            </div>

        </div>
    </div>
</div>
{% endblock %}
