{% extends "accounts/base.html" %}
{% load i18n %}
{% block content %}

  <h1 class="h5 mb-4">{% translate "Elegí tu tipo de cuenta" %}</h1>
  <div class="d-grid gap-2 col-6 mx-auto">
    <a class="btn btn-primary" href="{% url 'registro_cliente' %}">{% translate "Cliente" %}</a>

</script>

{% endblock %}
