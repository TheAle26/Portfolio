<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto no encontrado - ChangoMás Tracker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f4f4f4; color: #222;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .box {
            background: #fff; border-radius: 14px; padding: 34px 28px;
            max-width: 420px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.1);
        }
        .emoji { font-size: 3rem; }
        h1 { font-size: 1.2rem; margin: 12px 0 8px; }
        p { color: #666; font-size: .9rem; margin-bottom: 6px; }
        code {
            background: #f0f0f0; padding: 2px 8px; border-radius: 6px;
            font-size: .9rem; word-break: break-all;
        }
        .acciones { display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
        .acciones a {
            text-decoration: none; color: #fff; background: #0071ce;
            padding: 10px 18px; border-radius: 22px; font-size: .9rem; font-weight: 700;
        }
        .acciones a.sec { background: #888; }
    </style>
</head>
<body>
    <div class="box">
        <div class="emoji">🔍</div>
        <h1>Producto no encontrado</h1>
        {% if code %}<p>No hay ningún producto con el código <code>{{ code }}</code>.</p>{% endif %}
        <p>Puede que MasOnline no lo venda online o que todavía no lo hayamos relevado.</p>
        <div class="acciones">
            <a href="{% url 'changomas:scan' %}">📷 Escanear otro</a>
            <a class="sec" href="{% url 'changomas:product_list' %}">🛒 Ir al catálogo</a>
        </div>
    </div>
</body>
</html>
