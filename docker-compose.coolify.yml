x-app-environment: &app-environment
  DJANGO_ENV: ${DJANGO_ENV:-production}
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in Coolify}
  DB_NAME: ${DB_NAME:?Set DB_NAME in Coolify}
  DB_USER: ${DB_USER:?Set DB_USER in Coolify}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Coolify}
  DB_HOST: ${DB_HOST:?Use the hostname from Coolify's PostgreSQL Internal URL}
  DB_PORT: ${DB_PORT:-5432}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  FLESPI_TOKEN: ${FLESPI_TOKEN:-}
  GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
  # Debe quedar en false durante el ensayo y el restore final.
  BACKGROUND_PROCESSES_ENABLED: ${BACKGROUND_PROCESSES_ENABLED:-false}

x-app-service: &app-service
  build: .
  restart: unless-stopped
  environment: *app-environment

services:
  web:
    <<: *app-service
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; connection = socket.create_connection(('127.0.0.1', 8000), timeout=5); connection.close()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend-proxy:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - static_volume:/static:ro
      - media_volume:/media:ro
    depends_on:
      web:
        condition: service_healthy

  worker:
    <<: *app-service
    command: /app/run-background-service.sh python manage.py sync_flespi
    depends_on:
      web:
        condition: service_healthy

  generador_datos:
    <<: *app-service
    init: true
    command: >-
      /app/run-background-service.sh sh -c
      "python manage.py simular_viaje 123456789012345 &
      python manage.py simular_viaje 987654321098765 & wait"
    depends_on:
      web:
        condition: service_healthy

  scheduler_worker:
    <<: *app-service
    command: /app/run-background-service.sh python run_scheduler.py
    depends_on:
      web:
        condition: service_healthy

volumes:
  static_volume:
  media_volume:
