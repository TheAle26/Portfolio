# Sets the max number of simultaneous connections that can be opened by a worker process
events {
   worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Rate limit para las vistas públicas de changomas (sin auth):
    # 10 req/s por IP con ráfagas de 20 alcanza de sobra para uso real
    # y frena loops de scraping/DoS contra la Raspberry.
    limit_req_zone $binary_remote_addr zone=changomas:10m rate=10r/s;

    # 1. Obligar a usar HTTPS (Redirección)
    server {
        listen 80;
        server_name vincentalejo.myddns.me;
        return 301 https://$host$request_uri;
    }

    # 2. El servidor seguro (HTTPS)
    server {
        listen 443 ssl;
        server_name vincentalejo.myddns.me;

        # Ubicación de los certificados que le pasamos por Docker
        ssl_certificate /etc/letsencrypt/live/vincentalejo.myddns.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/vincentalejo.myddns.me/privkey.pem;

        location /static/ {
            alias /static/;
            expires 7d;
        }

        location /media/ {
            alias /media/;
            expires 7d;
        }

        location /changomas {
            limit_req zone=changomas burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}