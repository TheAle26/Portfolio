events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Conserva la protección de las vistas públicas del comparador.
    limit_req_zone $binary_remote_addr zone=changomas:10m rate=10r/s;

    # Coolify/Traefik termina TLS. Este Nginx sólo atiende dentro de la red Docker.
    server {
        listen 80;
        server_name _;

        location /static/ {
            alias /static/;
            expires 7d;
        }

        location /media/ {
            alias /media/;
            expires 7d;
        }

        location /changomas {
            limit_req zone=changomas burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # No usar $scheme: entre Traefik y Nginx siempre sería "http".
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }
}
